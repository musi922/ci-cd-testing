name: CI

on:
  push:
    branches:
      - 'feature/**'
      - 'hotfix/**'
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - develop
      - release
      - main
    paths-ignore:
      - '.vscode/**'
      - 'docs/**'
      - 'README.md'

jobs:
  validate-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name
        run: |
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
          echo "Branch: $BRANCH"
          if [[ "$BRANCH" =~ ^(main|release|develop)$ ]]; then
            echo "Permanent branch - validation skipped."
            exit 0
          fi
          if ! echo "$BRANCH" | grep -qP '^(feature|hotfix)/BTP-[0-9]+-[a-z0-9-]+$'; then
            echo "Invalid branch name: $BRANCH"
            echo "Expected: feature/BTP-XX-description or hotfix/BTP-XX-description"
            exit 1
          fi
          echo "Branch name valid."

  security-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for hardcoded URLs and secrets
        run: |
          FAILED=0
          PATTERNS=(
            'http[s]?://[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}'
            'password\s*[:=]\s*["\x27][^"\x27]+'
            'api[_-]?key\s*[:=]\s*["\x27][^"\x27]+'
            'client[_-]?secret\s*[:=]\s*["\x27][^"\x27]+'
            'BasicAuth\s*\('
          )
          for PATTERN in "${PATTERNS[@]}"; do
            MATCHES=$(grep -rn --include="*.js" --include="*.ts" --include="*.cds" --include="*.json" -P "$PATTERN" . \
              --exclude-dir=node_modules --exclude-dir=.git || true)
            if [ -n "$MATCHES" ]; then
              echo "Forbidden pattern found: $PATTERN"
              echo "$MATCHES"
              FAILED=1
            fi
          done
          if [ $FAILED -eq 1 ]; then
            echo "Security check failed. Remove hardcoded URLs or credentials."
            exit 1
          fi
          echo "Security check passed."

  eslint-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  build-and-test:
    runs-on: ubuntu-latest
    needs: [validate-branch, security-check, eslint-check]
    permissions:
      contents: write
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Install MBT
        run: npm install -g mbt

      - name: Build project
        run: npm run build

      - name: Run tests
        run: npm test --if-present